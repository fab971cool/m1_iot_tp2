listener 1883

cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

require_certificate true # impose le mTLS : pas de cert client valide, pas de connexion
use_identity_as_username true # le CN du cert devient le nom d'utilisateur (-> ACL)

allow_anonymous false

# acl_file /mosquitto/config/acl # (vous l'écrirez à l'étape 4)
# tls_version tlsv1.2 # pas de protocole legacy

log_dest stdout
log_type all
connection_messages true